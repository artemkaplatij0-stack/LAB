<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="liquidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="75%" stop-color="#0284c7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.7" />
    </linearGradient>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#f0f9ff" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark circular backing for perfect contrast in both dark and light browser tabs -->
  <circle cx="32" cy="32" r="30" fill="#05070e" stroke="#0ea5e9" stroke-width="1.5" stroke-opacity="0.5" />

  <!-- Liquid with rounded bottom -->
  <path d="M 23 27 Q 27.5 29 32 27 Q 36.5 25 41 27 L 41 43 C 41 48 37 52 32 52 C 27 52 23 48 23 43 Z" fill="url(#liquidGrad)" filter="url(#glow)" />

  <!-- Liquid meniscus top wave -->
  <path d="M 23 27 Q 27.5 29 32 27 Q 36.5 25 41 27" stroke="#a5f3fc" stroke-width="1.5" stroke-linecap="round" />

  <!-- Rising bubbles inside test tube -->
  <circle cx="28" cy="42" r="1.8" fill="#ffffff" opacity="0.9" />
  <circle cx="35.5" cy="35" r="2.2" fill="#ffffff" opacity="0.95" />
  <circle cx="29.5" cy="31" r="1.4" fill="#ffffff" opacity="0.85" />
  <circle cx="33.5" cy="22" r="1.8" fill="#38bdf8" opacity="0.95" />

  <!-- Glass tube outline & body -->
  <path d="M 23 12 L 23 43 C 23 48 27 52 32 52 C 37 52 41 48 41 43 L 41 12" stroke="url(#glassGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Glass shine/highlight left side -->
  <path d="M 25 15 L 25 42 C 25 45.5 27.5 48 30 49" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.8" />

  <!-- Test tube top rim/lip -->
  <rect x="20" y="9" width="24" height="4.5" rx="2.25" fill="url(#rimGrad)" stroke="#0284c7" stroke-width="1" />
  <rect x="23" y="10.2" width="18" height="1.8" rx="0.9" fill="#ffffff" opacity="0.8" />
</svg>
